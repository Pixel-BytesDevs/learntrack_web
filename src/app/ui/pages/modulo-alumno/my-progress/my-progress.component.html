<div
	class="tw-flex tw-flex-col tw-w-full tw-h-full tw-bg-white tw-rounded-2xl tw-shadow-md tw-p-6 tw-font-inter tw-overflow-hidden"
>
	<!-- Encabezado -->
	<header
		class="tw-flex tw-flex-col sm:tw-flex-row tw-items-start sm:tw-items-center tw-justify-between tw-gap-4 tw-mb-6 tw-border-b tw-border-gray-200 tw-pb-4"
	>
		<h1 class="tw-text-2xl tw-font-semibold tw-text-gray-800">
			📈 Mi Progreso
		</h1>

		<!-- Segmentado / Tabs -->
		<nav
			class="tw-bg-gray-100 tw-rounded-full tw-p-1 tw-flex tw-text-sm tw-font-medium tw-w-full sm:tw-w-auto"
		>
			<button
				class="tw-flex-1 sm:tw-flex-none tw-px-4 tw-py-2 tw-rounded-full"
				[ngClass]="{
					'tw-bg-blue-600 tw-text-white tw-shadow-sm':
						selectedTab === 'general',
					'tw-text-gray-700 hover:tw-bg-gray-200': selectedTab !== 'general',
				}"
				(click)="selectTab('general')"
			>
				Vista General
			</button>

			<button
				class="tw-flex-1 sm:tw-flex-none tw-px-4 tw-py-2 tw-rounded-full"
				[ngClass]="{
					'tw-bg-blue-600 tw-text-white tw-shadow-sm': selectedTab === 'ruta',
					'tw-text-gray-700 hover:tw-bg-gray-200': selectedTab !== 'ruta',
				}"
				(click)="selectTab('ruta')"
			>
				Avance de Ruta
			</button>
		</nav>
	</header>

	<!-- Contenido dinámico -->
	<section
		class="tw-flex-1 tw-overflow-y-auto tw-animate-fade-in tw-duration-500 tw-px-2 sm:tw-px-4"
	>
		@if (selectedTab === 'general') {
			<ng-container>
				<div class="tw-text-gray-600 tw-text-center tw-mt-10">
					<p>Resumen general del progreso del estudiante.</p>
				</div>
			</ng-container>
		}

		@if (selectedTab === 'ruta') {
			<ng-container>
				<app-route-progress />
			</ng-container>
		}
	</section>
</div>
