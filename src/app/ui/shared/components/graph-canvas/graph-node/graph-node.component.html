<div
	class="tw-relative tw-flex tw-flex-col tw-justify-between tw-w-[300px] tw-h-auto tw-min-h-[100px] 
           tw-rounded-xl tw-border tw-transition-all tw-duration-300 tw-ease-out
           tw-cursor-pointer tw-group hover:tw-shadow-md hover:-tw-translate-y-1
           {{ bg() }} {{ border() }}"
>
	<div
		class="tw-flex tw-items-center tw-justify-between tw-px-5 tw-pt-5 tw-pb-2"
	>
		<div class="tw-flex tw-items-center tw-gap-2">
			<span
				class="tw-relative tw-flex tw-h-2.5 tw-w-2.5"
				*ngIf="node().state !== 'perfect'"
			>
				<span
					class="tw-animate-ping tw-absolute tw-inline-flex tw-h-full tw-w-full tw-rounded-full tw-opacity-75 {{
						accentBg()
					}}"
				></span>
				<span
					class="tw-relative tw-inline-flex tw-rounded-full tw-h-2.5 tw-w-2.5 {{
						accentBg()
					}}"
				></span>
			</span>

			<svg
				*ngIf="node().state === 'perfect'"
				class="tw-w-4 tw-h-4 text-amber-500"
				fill="currentColor"
				viewBox="0 0 20 20"
			>
				<path
					d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
				/>
			</svg>

			<span
				class="tw-text-xs tw-font-bold tw-tracking-wide tw-uppercase {{
					accentText()
				}}"
			>
				{{ stateLabel() }}
			</span>
		</div>

		<div
			class="tw-text-gray-400 group-hover:tw-text-gray-600 tw-transition-colors"
		>
			<svg
				class="tw-w-4 tw-h-4"
				fill="none"
				stroke="currentColor"
				viewBox="0 0 24 24"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M5 12h.01M12 12h.01M19 12h.01M6 21a9 9 0 110-18 9 9 0 010 18z"
				></path>
			</svg>
		</div>
	</div>

	<div class="tw-px-5 tw-pb-5">
		<h3
			class="tw-text-base tw-font-semibold tw-leading-snug tw-text-slate-800 group-hover:tw-text-slate-900 tw-line-clamp-2"
		>
			{{ node().title }}
		</h3>
		<!-- <p class="tw-mt-1 tw-text-xs tw-font-medium tw-text-slate-500 tw-truncate">
			ID: {{ node().id }}
		</p> -->
	</div>

	<div
		class="tw-absolute tw-inset-0 tw-rounded-xl tw-transition-opacity tw-duration-300 tw-pointer-events-none tw-mix-blend-overlay
                {{
			node().state === 'perfect' ? 'tw-bg-amber-100/50' : 'tw-bg-white/40'
		}} 
                tw-opacity-0 group-hover:tw-opacity-100"
	></div>
</div>
